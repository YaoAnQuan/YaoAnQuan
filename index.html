<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>药安全 · 查药助手</title>
    <style>
        /* ===== 全局重置 & 适老化基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #1a1a1a;
            font-size: 20px;
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #0a7e3d;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 18px;
            color: #666;
            margin-top: 4px;
        }
        .header .settings-icon {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
            line-height: 1;
        }
        .header .settings-icon:hover {
            background: #f0f0f0;
        }

        /* ===== 输入区域 ===== */
        .input-section {
            background: #f0f4f9;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 16px 18px;
            font-size: 22px;
            border: 2px solid #ccd7e6;
            border-radius: 16px;
            background: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input-row input:focus {
            border-color: #0a7e3d;
        }

        .input-row button {
            padding: 16px 28px;
            font-size: 24px;
            font-weight: 700;
            background: #0a7e3d;
            color: #fff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .input-row button:hover {
            background: #086a33;
        }
        .input-row button:active {
            transform: scale(0.96);
        }

        /* ===== 快捷操作按钮（仅拍照） ===== */
        .quick-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .quick-actions button {
            flex: 1;
            min-width: 120px;
            padding: 14px 0;
            font-size: 22px;
            font-weight: 600;
            border: 2px solid #0a7e3d;
            background: #e8f5ee;
            color: #0a7e3d;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quick-actions button:hover {
            background: #d0ebe0;
        }
        .quick-actions button:active {
            transform: scale(0.96);
        }

        .quick-actions .hint {
            width: 100%;
            font-size: 16px;
            color: #888;
            margin-top: 6px;
        }

        /* ===== 结果卡片 ===== */
        .result-area {
            margin-top: 20px;
            padding: 20px 16px;
            border-radius: 20px;
            background: #f8f9fc;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px dashed #d0d7e3;
            transition: all 0.3s;
        }

        .result-area .placeholder {
            color: #999;
            font-size: 20px;
        }

        .result-area.status-green {
            border-color: #0a7e3d;
            background: #e6f5ed;
        }
        .result-area.status-yellow {
            border-color: #b68b00;
            background: #fef7e0;
        }
        .result-area.status-red {
            border-color: #b22222;
            background: #fde8e8;
        }

        .result-area .result-icon {
            font-size: 56px;
            line-height: 1.2;
        }
        .result-area .result-title {
            font-size: 30px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .result-area .result-desc {
            font-size: 20px;
            color: #333;
            max-width: 90%;
        }
        .result-area .result-detail {
            font-size: 18px;
            color: #555;
            margin-top: 8px;
            background: rgba(255,255,255,0.6);
            padding: 10px 16px;
            border-radius: 12px;
            width: 100%;
        }

        /* 拍照结果中的药盒照片缩略图 */
        .result-area .photo-thumb {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /* OCR 识别出的文本块 */
        .result-area .ocr-text-block {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            width: 100%;
            text-align: left;
            font-size: 17px;
            color: #444;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
        }
        .result-area .ocr-text-block summary {
            cursor: pointer;
            font-weight: 600;
            color: #333;
            font-size: 18px;
        }

        /* ===== 朗读按钮 ===== */
        .result-actions {
            margin-top: 14px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .result-actions.show {
            display: flex;
        }

        .speak-btn {
            padding: 14px 32px;
            font-size: 24px;
            font-weight: 600;
            background: #2c6b9e;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(44,107,158,0.3);
        }
        .speak-btn:hover {
            background: #1f5480;
        }
        .speak-btn:active {
            transform: scale(0.96);
        }
        .speak-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 设置面板（模态） ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 28px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        .modal-box h2 {
            font-size: 26px;
            margin-bottom: 6px;
        }
        .modal-box p {
            font-size: 18px;
            color: #666;
            margin-bottom: 18px;
        }
        .modal-box label {
            display: block;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .modal-box input[type="password"],
        .modal-box input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 20px;
            border: 2px solid #ccd7e6;
            border-radius: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus {
            border-color: #0a7e3d;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-box .modal-actions button {
            flex: 1;
            padding: 14px 0;
            font-size: 20px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 100px;
        }
        .modal-box .modal-actions .btn-primary {
            background: #0a7e3d;
            color: #fff;
        }
        .modal-box .modal-actions .btn-primary:hover {
            background: #086a33;
        }
        .modal-box .modal-actions .btn-secondary {
            background: #eee;
            color: #333;
        }
        .modal-box .modal-actions .btn-secondary:hover {
            background: #ddd;
        }
        .modal-box .modal-actions .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .modal-box .modal-actions .btn-danger:hover {
            background: #c0392b;
        }
        .modal-box .api-link {
            display: inline-block;
            font-size: 16px;
            color: #0a7e3d;
            margin-top: 12px;
            text-decoration: underline;
        }

        /* ===== 拍照预览（全屏覆盖） ===== */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1150;
            flex-direction: column;
        }
        .preview-overlay.show {
            display: flex;
        }

        .preview-overlay .preview-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(0,0,0,0.4);
        }
        .preview-overlay .preview-top .preview-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        .preview-overlay .preview-top .preview-close {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-overlay .preview-img-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 0;
        }
        .preview-overlay .preview-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(255,255,255,0.1);
            object-fit: contain;
        }

        .preview-overlay .preview-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 16px 16px 36px;
            background: rgba(0,0,0,0.6);
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .preview-overlay .preview-footer button {
            padding: 16px 36px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
            min-width: 130px;
            letter-spacing: 1px;
        }
        .preview-overlay .preview-footer button:active {
            transform: scale(0.95);
        }
        .preview-overlay .preview-footer .btn-retake {
            background: #555;
            color: #fff;
            border: 2px solid #888;
        }
        .preview-overlay .preview-footer .btn-retake:hover {
            background: #666;
        }
        .preview-overlay .preview-footer .btn-confirm {
            background: #0a7e3d;
            color: #fff;
            box-shadow: 0 4px 16px rgba(10,126,61,0.4);
        }
        .preview-overlay .preview-footer .btn-confirm:hover {
            background: #0d9649;
        }

        /* ===== Loading 指示器 ===== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .loading-overlay.show {
            display: flex;
        }

        .loading-box {
            background: #fff;
            border-radius: 24px;
            padding: 32px 36px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e0e0e0;
            border-top-color: #0a7e3d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-box p {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .loading-box .loading-sub {
            font-size: 16px;
            color: #888;
            margin-top: 6px;
        }

        /* ===== 通知 Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 18px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.toast-error {
            background: #e74c3c;
        }
        .toast.toast-success {
            background: #0a7e3d;
        }

        /* ===== 免责声明 ===== */
        .disclaimer {
            margin-top: 16px;
            font-size: 14px;
            color: #999;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            padding-top: 16px;
        }
        .disclaimer a {
            color: #0a7e3d;
            text-decoration: underline;
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 420px) {
            body { font-size: 18px; padding: 10px; }
            .app-container { padding: 16px 12px; }
            .header h1 { font-size: 30px; }
            .input-row input { font-size: 20px; padding: 14px; }
            .input-row button { font-size: 20px; padding: 14px 20px; }
            .quick-actions button { font-size: 18px; }
            .speak-btn { font-size: 20px; padding: 12px 24px; }
            .modal-box { padding: 20px 16px; }
            .modal-box h2 { font-size: 22px; }
        }

        /* ============================================================
           【新增】顶部功能导航 Tab（查药 / 吃药提醒）
           ============================================================ */
        .top-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: #eef2f7;
            border-radius: 16px;
            padding: 6px;
        }
        .top-tabs button {
            flex: 1;
            padding: 14px 8px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #666;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .top-tabs button.active {
            background: #0a7e3d;
            color: #fff;
            box-shadow: 0 2px 10px rgba(10,126,61,0.25);
        }

        /* 各功能面板显隐 */
        .panel { display: none; }
        .panel.active { display: block; }

        /* ============================================================
           【新增】拍照方式选择（相机 / 相册）
           ============================================================ */
        .photo-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .photo-actions button {
            flex: 1;
            min-width: 120px;
            padding: 16px 0;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .photo-actions button:active { transform: scale(0.96); }
        .photo-actions .btn-camera {
            background: #0a7e3d;
            color: #fff;
            box-shadow: 0 4px 14px rgba(10,126,61,0.3);
        }
        .photo-actions .btn-camera:hover { background: #086a33; }
        .photo-actions .btn-gallery {
            background: #e9f2fb;
            color: #2c6b9e;
            border: 2px solid #2c6b9e;
        }
        .photo-actions .btn-gallery:hover { background: #dbeafa; }

        /* ============================================================
           【新增】服用提醒 / 服药计划
           ============================================================ */
        .reminder-section { display: flex; flex-direction: column; gap: 18px; }

        .reminder-card {
            background: #fff;
            border: 2px solid #e3e9f1;
            border-radius: 20px;
            padding: 18px 16px;
        }
        .reminder-card h3 {
            font-size: 24px;
            font-weight: 700;
            color: #0a7e3d;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group { margin-bottom: 14px; }
        .field-group label {
            display: block;
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        .field-group input[type="text"],
        .field-group input[type="time"],
        .field-group input[type="number"] {
            width: 100%;
            padding: 15px 16px;
            font-size: 22px;
            border: 2px solid #ccd7e6;
            border-radius: 14px;
            background: #fafcff;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
        }
        .field-group input:focus { border-color: #0a7e3d; }

        .med-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .med-row input[type="time"] {
            flex: 1;
            min-width: 130px;
            padding: 14px;
            font-size: 22px;
            border: 2px solid #ccd7e6;
            border-radius: 14px;
            background: #fff;
            outline: none;
            text-align: center;
        }
        .med-row .rm-time {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: none;
            background: #fde8e8;
            color: #b22222;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-add-time {
            padding: 12px 20px;
            font-size: 20px;
            font-weight: 600;
            border: 2px dashed #0a7e3d;
            background: #fff;
            color: #0a7e3d;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-add-time:hover { background: #e8f5ee; }

        .btn-primary-lg {
            width: 100%;
            padding: 18px;
            font-size: 26px;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            background: #0a7e3d;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(10,126,61,0.3);
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .btn-primary-lg:hover { background: #086a33; }
        .btn-primary-lg:active { transform: scale(0.98); }

        /* 计划列表 */
        .plan-list { display: flex; flex-direction: column; gap: 12px; }
        .plan-item {
            background: #fff;
            border: 2px solid #e3e9f1;
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .plan-item .plan-icon {
            font-size: 34px;
            flex-shrink: 0;
        }
        .plan-item .plan-info { flex: 1; min-width: 0; }
        .plan-item .plan-name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .plan-item .plan-meta {
            font-size: 18px;
            color: #666;
            margin-top: 4px;
            line-height: 1.5;
        }
        .plan-item .plan-status {
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .plan-item .plan-status.todo { background: #fef7e0; color: #b68b00; }
        .plan-item .plan-status.done { background: #e6f5ed; color: #0a7e3d; }
        .plan-item .plan-del {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: #fde8e8;
            color: #b22222;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .plan-empty {
            text-align: center;
            color: #999;
            font-size: 20px;
            padding: 40px 0;
        }

        /* 服药提醒浮层（到点弹窗） */
        .pill-alert {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1300;
            justify-content: center;
            align-items: center;
            padding: 24px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .pill-alert.show { display: flex; }
        .pill-alert .pill-box {
            background: #fff;
            border-radius: 26px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }

<script>
    // ================================================================
    //  核心逻辑 —— 结合 DMXAPI 大模型视觉识别 + 规则引擎 + 语音朗读
    // ================================================================

    (function() {
        'use strict';

        // ---------- DOM 引用 ----------
        const inputEl        = document.getElementById('drugInput');
        const checkBtn       = document.getElementById('checkBtn');
        const resultArea     = document.getElementById('resultArea');
        const resultActions  = document.getElementById('resultActions');
        const speakBtn       = document.getElementById('speakBtn');
        const photoBtn       = document.getElementById('photoBtn');
        const galleryBtn     = document.getElementById('galleryBtn');
        const cameraInput    = document.getElementById('cameraInput');
        const galleryFileInput = document.getElementById('galleryFileInput');

        // Tab
        const tabCheck       = document.getElementById('tabCheck');
        const tabRemind      = document.getElementById('tabRemind');
        const panelCheck     = document.getElementById('panelCheck');
        const panelRemind    = document.getElementById('panelRemind');

        // 服药提醒
        const reminderStatus = document.getElementById('reminderStatus');
        const medName        = document.getElementById('medName');
        const medDose        = document.getElementById('medDose');
        const timeSlots      = document.getElementById('timeSlots');
        const addTimeBtn     = document.getElementById('addTimeBtn');
        const saveMedBtn     = document.getElementById('saveMedBtn');
        const planList       = document.getElementById('planList');
        const pillAlert      = document.getElementById('pillAlert');
        const pillAlertName  = document.getElementById('pillAlertName');
        const pillAlertDose  = document.getElementById('pillAlertDose');
        const pillOkBtn      = document.getElementById('pillOkBtn');
        const pillLaterBtn   = document.getElementById('pillLaterBtn');

        // 设置
        const settingsIcon    = document.getElementById('settingsIcon');
        const settingsModal   = document.getElementById('settingsModal');
        const apiKeyInput     = document.getElementById('apiKeyInput');
        const saveApiKeyBtn   = document.getElementById('saveApiKeyBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const clearApiKeyBtn  = document.getElementById('clearApiKeyBtn');

        // 预览
        const previewOverlay  = document.getElementById('previewOverlay');
        const previewImg      = document.getElementById('previewImg');
        const retakeBtn       = document.getElementById('retakeBtn');
        const confirmPhotoBtn = document.getElementById('confirmPhotoBtn');
        const previewCloseBtn = document.getElementById('previewCloseBtn');
        // Loading
        const loadingOverlay  = document.getElementById('loadingOverlay');
        const loadingText     = document.getElementById('loadingText');
        const loadingSub      = document.getElementById('loadingSub');

        // Toast
        const toast           = document.getElementById('toast');
        let toastTimer        = null;

        // ---------- 状态 ----------
        let currentResult     = null;      // 当前分析结果（供朗读用）
        let capturedImageData = null;      // 当前捕获的图片数据 (dataURL)
        let isAnalyzing       = false;     // 防止重复提交

        // =============================================================
        //  Toast 通知
        // =============================================================
        function showToast(msg, type, duration) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.className = 'toast';
            if (type) toast.classList.add('toast-' + type);
            // 触发重排后显示
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, duration || 3000);
        }

        // =============================================================
        //  API Key 管理
        // =============================================================
        function loadApiKey() {
            var key = localStorage.getItem('dmxapi_key') || '';
            apiKeyInput.value = key;
            return key;
        }

        function saveApiKey(key) {
            if (key && key.trim()) {
                localStorage.setItem('dmxapi_key', key.trim());
                showToast('✅ API Key 已保存', 'success');
            } else {
                localStorage.removeItem('dmxapi_key');
                showToast('已清除 API Key');
            }
        }

        function getApiKey() {
            return localStorage.getItem('dmxapi_key') || '';
        }

        // =============================================================
        //  图片压缩（发送 API 前缩小尺寸）
        // =============================================================
        function resizeImage(dataUrl, maxSize) {
            maxSize = maxSize || 1280;
            return new Promise(function(resolve) {
                var img = new Image();
                img.onload = function() {
                    var width = img.width;
                    var height = img.height;
                    if (width <= maxSize && height <= maxSize) {
                        resolve(dataUrl);
                        return;
                    }
                    if (width > height) {
                        height = Math.round(height * maxSize / width);
                        width = maxSize;
                    } else {
                        width = Math.round(width * maxSize / height);
                        height = maxSize;
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.src = dataUrl;
            });
        }

        // =============================================================
        //  DMXAPI 大模型调用 —— 识别药盒文字
        // =============================================================
        async function callDMXAPIOCR(imageDataUrl) {
            var apiKey = getApiKey();
            if (!apiKey) {
                throw new Error('请先设置 DMXAPI Key（点击右上角 ⚙️）');
            }

            // 从 data URL 中提取 base64 数据
            var base64Data = imageDataUrl.split(',')[1];
            var mimeType = imageDataUrl.match(/^data:(image\/\w+);/);
            mimeType = mimeType ? mimeType[1] : 'image/jpeg';

            var prompt = '你是一个药品包装文字识别助手。请仔细识别这张药品包装盒图片中的所有文字，逐项列出：\n\n' +
                '  - 药品/产品名称\n' +
                '  - 批准文号（国药准字、国食健字、食健备、SC编号、进口药品注册证号等，请完整抄录）\n' +
                '  - 生产厂家/企业名称\n' +
                '  - 生产日期 / 有效期 / 保质期\n' +
                '  - 产品批号\n' +
                '  - 成分 / 主要原料\n' +
                '  - 功能主治 / 适用范围 / 产品标准\n' +
                '  - 其他可见文字\n\n' +
                '注意：批准文号请务必完整识别，不要截断。国药准字后面的格式是1个字母+8位数字。\n' +
                '必须以 JSON 格式返回，格式为：{"text": "你的完整识别结果"}。不要有任何额外说明。';

            var payload = {
                model: 'gpt-4o',
                messages: [
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: prompt },
                            {
                                type: 'image_url',
                                image_url: { url: 'data:' + mimeType + ';base64,' + base64Data }
                            }
                        ]
                    }
                ],
                max_tokens: 2048,
                temperature: 0.1,
                response_format: { type: 'json_object' }
            };

            var resp = await fetch('https://www.dmxapi.cn/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) {
                var errMsg = '';
                try {
                    var errData = await resp.json();
                    errMsg = errData.error && errData.error.message ? errData.error.message : '';
                } catch(e) {}
                throw new Error('DMXAPI 错误 (' + resp.status + '): ' + (errMsg || resp.statusText));
            }

            var data = await resp.json();
            var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (!content) {
                throw new Error('API 返回格式异常，未找到识别结果');
            }

            // 解析 JSON 响应，提取 text 字段
            var parsed;
            try {
                parsed = JSON.parse(content);
            } catch (e) {
                // 尝试从文本中提取 JSON
                var jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    try {
                        parsed = JSON.parse(jsonMatch[0]);
                    } catch (e2) {
                        throw new Error('返回内容不是有效 JSON 格式');
                    }
                } else {
                    throw new Error('返回内容不是有效 JSON 格式');
                }
            }

            return parsed.text || parsed.content || parsed.result || JSON.stringify(parsed);
        }

        // =============================================================
        //  OCR 结果分析：从 AI 回答中提取关键信息 + 本地规则引擎
        // =============================================================
        function analyzeOCRResult(ocrText) {
            // 1. 尝试提取批准文号
            var approvalNumbers = [];
            var approvalPatterns = [
                /国药准字[HZSJ]\d{8}/g,
                /国食健字[GJ]\d{4,}/g,
                /食健备[GJ]\d{4,}/g,
                /SC\d{14}/g,
                /进口药品注册证号[HZSJ]\d{8}/g
            ];
            approvalPatterns.forEach(function(p) {
                var matches = ocrText.match(p);
                if (matches) {
                    matches.forEach(function(m) { approvalNumbers.push(m); });
                }
            });
            // 去重
            approvalNumbers = approvalNumbers.filter(function(v, i, a) { return a.indexOf(v) === i; });

            // 2. 运行本地规则引擎
            var localResults = [];
            if (approvalNumbers.length > 0) {
                approvalNumbers.forEach(function(code) {
                    var r = analyzeDrugCode(code);
                    if (r.status !== 'none') localResults.push(r);
                });
            }

            // 3. 检查可疑关键词（全文本）
            var fakeKeywords = ['根治', '特效', '祖传', '偏方', '秘方', '神药', '万能', '速效', '彻底治愈', '永不复发'];
            var foundFake = [];
            fakeKeywords.forEach(function(kw) {
                if (ocrText.indexOf(kw) !== -1) {
                    foundFake.push(kw);
                }
            });

            // 4. 检查过期/有效期信息
            var hasExpiryInfo = /有效期|保质期|生产日期|EXP|失效/.test(ocrText);
            var isExpired = false;
            var expiryMatch = ocrText.match(/(\d{4})\s*[年\.\-/]\s*(\d{1,2})\s*[月\.\-/]/);
            if (expiryMatch) {
                var year = parseInt(expiryMatch[1], 10);
                var month = parseInt(expiryMatch[2], 10);
                if (year < 2026 || (year === 2026 && month < 7)) {
                    isExpired = true;
                }
            }
            // 也检查 "有效期至" 后的年份
            var expiryMatch2 = ocrText.match(/有效期至.*?(\d{4})/);
            if (expiryMatch2) {
                var year2 = parseInt(expiryMatch2[1], 10);
                if (year2 < 2026) {
                    isExpired = true;
                } else if (year2 === 2026) {
                    // 检查是否提到月份
                    var monthMatch = expiryMatch2[0].match(/(\d{4})[年\.\-/](\d{1,2})/);
                    if (monthMatch && parseInt(monthMatch[2], 10) < 7) {
                        isExpired = true;
                    }
                }
            }

            // 5. 综合判断
            var hasDrugApproval = /国药准字/.test(ocrText);
            var hasHealthApproval = /国食健字|食健备/.test(ocrText);
            var hasFoodSC = /SC\d{14}/.test(ocrText);

            // 构建最终结果
            // 优先使用规则引擎的结果（如果有批准文号）
            if (localResults.length > 0) {
                // 找到最严重的结果
                var severityOrder = { 'green': 0, 'yellow': 1, 'red': 2 };
                var worst = localResults[0];
                localResults.forEach(function(r) {
                    if ((severityOrder[r.status] || 0) > (severityOrder[worst.status] || 0)) {
                        worst = r;
                    }
                });

                // 附加额外警告
                var extraWarnings = [];
                if (foundFake.length > 0) {
                    extraWarnings.push('发现可疑用语：' + foundFake.join('、'));
                }
                if (isExpired) {
                    extraWarnings.push('⚠️ 该产品可能已过期！');
                }
                if (!hasExpiryInfo) {
                    extraWarnings.push('未识别到有效期信息，请核对包装');
                }

                var detailParts = [worst.detail];
                extraWarnings.forEach(function(w) { detailParts.push(w); });
                worst.detail = detailParts.join('<br>');
                // 如果有过期，覆盖状态为红色
                if (isExpired) {
                    worst.status = 'red';
                    worst.icon = '🚫';
                    worst.title = '⚠️ 产品可能已过期';
                    worst.desc = '识别到有效期信息显示该产品可能已过期';
                }
                return worst;
            }

            // 没有匹配到批准文号
            var warnings = [];
            if (foundFake.length > 0) {
                warnings.push('含有违规用语：' + foundFake.join('、'));
            }
            if (isExpired) {
                warnings.push('该产品可能已过期');
            }
            if (foundFake.length > 0) {
                return {
                    status: 'red',
                    icon: '🚫',
                    title: '⚠️ 发现可疑宣传用语',
                    desc: foundFake.join('、'),
                    detail: '❌ 正规药品/食品包装上禁止使用此类夸大宣传词汇'
                };
            }
            if (isExpired) {
                return {
                    status: 'red',
                    icon: '🚫',
                    title: '⚠️ 产品可能已过期',
                    desc: '识别到的有效期显示已过期',
                    detail: '❌ 请勿使用过期药品，立即停止使用并妥善处理'
                };
            }

            // 如果没有批准文号也无明显违规，返回存疑
            return {
                status: 'yellow',
                icon: '🟡',
                title: '未识别到批准文号',
                desc: '在药盒上未找到标准的药品/保健品批准文号',
                detail: '⚠️ 请仔细核对：产品是否声称有治疗功效？<br>' +
                       '💡 建议：输入批准文号到上方文本框进行二次验证'
            };
        }

        // =============================================================
        //  规则引擎（与原有逻辑一致）
        // =============================================================
        function analyzeDrugCode(code) {
            var raw = (code || '').trim().toUpperCase();
            if (!raw) {
                return { status: 'none', icon: '✏️', title: '请输入文号', desc: '在输入框中粘贴或输入批准文号', detail: '' };
            }

            var drugPattern = /^国药准字[HZSJ]\d{8}$/;
            if (drugPattern.test(raw)) {
                var letter = raw.charAt(4);
                var typeMap = { 'H': '化学药', 'Z': '中成药', 'S': '生物药', 'J': '进口分包装' };
                var type = typeMap[letter] || '药品';
                return {
                    status: 'green',
                    icon: '✅',
                    title: '格式符合药品标准',
                    desc: '文号：' + raw + '（' + type + '）',
                    detail: '✔ 格式正确，建议前往国家药监局官网核对备案信息'
                };
            }

            var healthPattern = /^(国食健字[GJ]\d+|食健备[GJ]\d+)$/;
            if (healthPattern.test(raw)) {
                return {
                    status: 'yellow',
                    icon: '🟡',
                    title: '这是保健食品（非药品）',
                    desc: '文号：' + raw,
                    detail: '⚠️ 保健食品不能替代药品，不具备治疗疾病的功能'
                };
            }

            var foodPattern = /^SC\d{14}$/;
            if (foodPattern.test(raw)) {
                return {
                    status: 'yellow',
                    icon: '🟡',
                    title: '这是普通食品',
                    desc: '生产许可证号：' + raw,
                    detail: '⚠️ 食品不具备任何治疗功效，宣传"治病"即为违法'
                };
            }

            var fakeKeywords = ['根治', '降压', '降糖', '风湿', '特效', '祖传', '偏方', '秘方', '神药'];
            for (var i = 0; i < fakeKeywords.length; i++) {
                if (raw.indexOf(fakeKeywords[i]) !== -1) {
                    return {
                        status: 'red',
                        icon: '🚫',
                        title: '⚠️ 疑似虚假宣传',
                        desc: '含有违规用语："' + fakeKeywords[i] + '"',
                        detail: '❌ 正规药品/食品包装上禁止使用此类夸大宣传词汇'
                    };
                }
            }

            if (raw.indexOf('国药准字') !== -1) {
                return {
                    status: 'red',
                    icon: '🚫',
                    title: '文号格式错误',
                    desc: '"' + raw + '" 不符合国药准字规范',
                    detail: '❌ 正规格式：国药准字 + H/Z/S/J + 8位数字'
                };
            }

            if (raw.indexOf('国食健字') !== -1 || raw.indexOf('食健备') !== -1) {
                return {
                    status: 'red',
                    icon: '🚫',
                    title: '保健品文号格式错误',
                    desc: '"' + raw + '" 格式不正确',
                    detail: '❌ 国产：国食健字G+数字 / 食健备G+数字'
                };
            }

            return {
                status: 'red',
                icon: '❓',
                title: '无法识别该文号',
                desc: '输入内容：' + raw,
                detail: '❌ 既不符合药品、保健品，也不符合食品标准编号，请高度警惕'
            };
        }

        // =============================================================
        //  语音朗读（与原有逻辑一致）
        // =============================================================
        function getSpeakText(result) {
            if (!result || result.status === 'none') {
                return '请先输入文号并点击查验';
            }
            var statusMap = { 'green': '安全', 'yellow': '请注意', 'red': '危险' };
            var statusWord = statusMap[result.status] || '未知';
            var cleanTitle = result.title.replace(/[⚠️✅🚫❓🟡]/g, '').trim();
            var cleanDesc = result.desc.replace(/[：:✔️⚠️❌]/g, '').trim();
            var cleanDetail = result.detail.replace(/<br>/g, '，').replace(/[：:✔️⚠️❌]/g, '').trim();
            return statusWord + '，' + cleanTitle + '。' + cleanDesc + '。' + cleanDetail;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                showToast('当前浏览器不支持语音朗读', 'error');
                return;
            }
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            var voices = window.speechSynthesis.getVoices();
            var zhVoice = voices.find(function(v) { return v.lang.startsWith('zh'); });
            if (zhVoice) utterance.voice = zhVoice;

            speakBtn.disabled = true;
            speakBtn.textContent = '🔊 朗读中...';
            utterance.onend = function() {
                speakBtn.disabled = false;
                speakBtn.textContent = '🔊 朗读结果';
            };
            utterance.onerror = function() {
                speakBtn.disabled = false;
                speakBtn.textContent = '🔊 朗读结果';
            };
            window.speechSynthesis.speak(utterance);
        }

        // =============================================================
        //  渲染结果
        // =============================================================
        function renderResult(result, photoDataUrl, ocrRawText) {
            currentResult = result;
            resultArea.className = 'result-area';
            resultArea.innerHTML = '';

            if (result.status === 'none') {
                resultArea.innerHTML = '<span class="placeholder">👆 ' + result.title + '</span>';
                resultActions.classList.remove('show');
                return;
            }

            resultArea.classList.add('status-' + result.status);

            var photoHtml = photoDataUrl
                ? '<img class="photo-thumb" src="' + photoDataUrl + '" alt="药盒照片" />'
                : '';

            var ocrHtml = '';
            if (ocrRawText) {
                // 截取前 300 字展示
                var shortText = ocrRawText.length > 300 ? ocrRawText.slice(0, 300) + '...' : ocrRawText;
                ocrHtml = '<details class="ocr-text-block"><summary>📄 AI 识别详情</summary>'
                        + '<div style="margin-top:8px;">' + escapeHtml(shortText) + '</div></details>';
            }

            var html = ''
                + photoHtml
                + '<div class="result-icon">' + result.icon + '</div>'
                + '<div class="result-title">' + result.title + '</div>'
                + '<div class="result-desc">' + result.desc + '</div>'
                + '<div class="result-detail">' + result.detail + '</div>'
                + ocrHtml;

            resultArea.innerHTML = html;
            resultActions.classList.add('show');
        }

        // 简易转义
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // =============================================================
        //  服药提醒模块（数据存 localStorage，纯前端）
        // =============================================================
        var MED_PLAN_KEY = 'medicine_plans_v1';
        var plans = loadPlans();        // [{id, name, dose, times:['08:00',...]}]
        var currentRemindAction = null; // 当前弹窗对应的计划 id + 时间
        var remindTimer = null;

        // --- 读取计划 ---
        function loadPlans() {
            try {
                var raw = localStorage.getItem(MED_PLAN_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {

            }
        }

        function savePlans() {

                showToast('保存失败，浏览器存储不可用', 'error');

        // --- 添加一个时间输入框（默认补当前下一个整点）---
        function addTimeInput(value) {
            var row = document.createElement('div');
            row.className = 'med-row';
            var input = document.createElement('input');
            input.type = 'time';
            input.value = value || '';
            var del = document.createElement('button');

            });

            row.appendChild(del);

        // --- 收集当前输入的时间列表 ---
        function collectTimes() {
            var inputs = timeSlots.querySelectorAll('input[type="time"]');
            var times = [];
            inputs.forEach(function(inp) {
                if (inp.value) times.push(inp.value);
            });
            return times;
        }

        // --- 渲染计划列表 ---
        function renderPlans() {
            planList.innerHTML = '';
            if (plans.length === 0) {
                planList.innerHTML = '<div class="plan-empty">还没有吃药计划，先在上面添加吧 👆</div>';
                return;
            }
            plans.forEach(function(p) {
                var item = document.createElement('div');
                item.className = 'plan-item';
                var name = escapeHtml(p.name);
                var dose = p.dose ? '，每次 ' + escapeHtml(p.dose) : '';
                var timesHtml = p.times.map(function(t) { return '<span>' + t + '</span>'; }).join('、') || '未设置';
                item.innerHTML =
                    '<div class="plan-icon">💊</div>' +
                    '<div class="plan-info">' +
                        '<div class="plan-name">' + name + '</div>' +
                        '<div class="plan-meta">' +
                            '服用时间：' + timesHtml + dose +
                        '</div>' +
                    '</div>' +
                    '<div class="plan-status">已保存</div>' +
                    '<button class="plan-del" title="删除">🗑</button>';
                var delBtn = item.querySelector('.plan-del');
                delBtn.addEventListener('click', function() {
                    if (confirm('确定删除「' + p.name + '」这个吃药计划吗？')) {
                        plans = plans.filter(function(x) { return x.id !== p.id; });
                        savePlans();
                        renderPlans();
                        updateReminderStatus();
                        showToast('已删除', 'success');
                    }
                });
                planList.appendChild(item);
            });
        }

        // --- 保存新计划 ---
        function saveMedPlan() {
            var name = medName.value.trim();
            if (!name) {
                showToast('请输入药名', 'error');
                medName.focus();
                return;
            }
            var times = collectTimes();
            if (times.length === 0) {
                showToast('请至少添加一个服用时间', 'error');
                return;
            }
            // 去重 + 排序
            times = times.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort();
            plans.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name: name,
                dose: medDose.value.trim(),
                times: times
            });
            savePlans();
            renderPlans();
            updateReminderStatus();
            // 清空输入
            medName.value = '';
            medDose.value = '';
            timeSlots.innerHTML = '';
            addTimeInput(nowPlusOneHour());
            showToast('✅ 吃药计划已保存', 'success');
        }

        // --- 工具：下一个整点时间字符串 HH:MM ---
        function nowPlusOneHour() {
            var d = new Date(Date.now() + 60 * 60 * 1000);
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function pad(n) { return (n < 10 ? '0' : '') + n; }

        // --- 工具：当前时间 HH:MM ---
        function nowHM() {
            var d = new Date();
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        // --- 定时检测是否到了服药时间 ---
        function checkReminders() {
            // 页面上没开提醒面板时也照常检测
            var current = nowHM();
            var todayKey = new Date().toDateString();
            var lastNotifiedKey = localStorage.getItem('med_last_notified') || '';

            plans.forEach(function(p) {
                p.times.forEach(function(t) {
                    if (t === current) {
                        var key = p.id + '_' + t + '_' + todayKey;
                        if (lastNotifiedKey !== key) {
                            localStorage.setItem('med_last_notified', key);
                            fireReminder(p, t);
                        }
                    }
                });
            });
        }

        // --- 触发服药弹窗 + 系统通知 + 语音 ---
        function fireReminder(plan, time) {
            currentRemindAction = { id: plan.id, time: time };
            pillAlertName.textContent = plan.name;
            pillAlertDose.textContent = plan.dose ? ('每次剂量：' + plan.dose) : '到时间啦，请按时服用';
            pillAlert.classList.add('show');

            // 浏览器系统通知
            try {
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('💊 该吃药啦', {
                        body: '该服用「' + plan.name + '」了' + (plan.dose ? '（' + plan.dose + '）' : '')
                    });
                }
            } catch (e) {}

            // 语音提醒
            speakText('该吃药啦，请服用' + plan.name + (plan.dose ? '，剂量' + plan.dose : ''));
        }

        // --- 请求系统通知权限 ---
        function requestNotifyPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(function() {

                });

        // --- 更新提醒状态提示条 ---

            var notifOk = !('Notification' in window) || Notification.permission === 'granted';
            if (plans.length > 0 && notifOk) {
                reminderStatus.className = 'reminder-enabled';
                reminderStatus.textContent = '⏰ 吃药提醒已开启，共 ' + plans.length + ' 个计划';
            } else if (plans.length > 0 && !notifOk) {
                reminderStatus.className = 'reminder-disabled';
                reminderStatus.textContent = '🔕 系统通知未开启，到点会在页面内提醒（可点击右上角 ⚙️ 附近开启）';
            } else {
                reminderStatus.className = 'reminder-disabled';

        // =============================================================

        // =============================================================
        async function handlePhotoCapture(dataUrl) {
            if (isAnalyzing) return;
            isAnalyzing = true;

            try {
                // 显示加载
                loadingOverlay.classList.add('show');
                loadingText.textContent = '🤖 AI 正在识别...';
                loadingSub.textContent = 'DMXAPI 大模型正在分析药盒文字，请稍候（约 5-15 秒）';

                // 压缩图片
                var resized = await resizeImage(dataUrl, 1280);

                // 调用 DMXAPI 大模型视觉识别
                var ocrResult = await callDMXAPIOCR(resized);

                // 分析结果
                var analysis = analyzeOCRResult(ocrResult);

                // 渲染
                renderResult(analysis, dataUrl, ocrResult);

                // 如果状态不是 "none"，自动朗读
                if (analysis.status !== 'none') {
                    var text = getSpeakText(analysis);
                    setTimeout(function() { speakText(text); }, 500);
                }

            } catch (err) {
                console.error('OCR Error:', err);
                showToast('❌ ' + err.message, 'error', 4000);
                // 恢复占位状态
                resultArea.className = 'result-area';
                resultArea.innerHTML = '<span class="placeholder">📸 拍照识别失败：' + escapeHtml(err.message) + '</span>';
                resultActions.classList.remove('show');
            } finally {
                isAnalyzing = false;
                loadingOverlay.classList.remove('show');
            }
        }

        // =============================================================
        //  图片选择与方向校正 + 预览
        // =============================================================
        // 读取文件 -> 应用 EXIF 方向 -> 统一以 dataURL 展示到预览
        function handleFileSelected(file, source) {
            if (!file || !file.type || file.type.indexOf('image/') !== 0) {
                showToast('请选择图片文件', 'error');
                return;
            }
            // 拒绝明显过大的文件（例如 > 25MB），避免内存问题
            if (file.size > 25 * 1024 * 1024) {
                showToast('图片过大，请重新拍摄或选择较小的图片', 'error');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var dataUrl = e.target.result;
                // 用 canvas 校正手机照片的 EXIF 旋转，同时统一为 JPEG
                normalizeImage(dataUrl, function(correctedDataUrl) {
                    // 清理上一张未提交的 blob/dataUrl（避免内存泄漏）
                    if (capturedImageData && capturedImageData.indexOf('blob:') === 0) {
                        URL.revokeObjectURL(capturedImageData);
                    }
                    capturedImageData = correctedDataUrl;
                    previewImg.src = correctedDataUrl;
                    previewOverlay.classList.add('show');
                });
            };
            reader.onerror = function() {
                showToast('图片读取失败，请重试', 'error');
            };
            reader.readAsDataURL(file);
        }

        // 将图片绘制到 canvas 并读取图片方向（EXIF），正确旋转后再导出
        function normalizeImage(dataUrl, done) {
            var img = new Image();
            img.onload = function() {
                try {
                    // 读取 EXIF 方向
                    var orientation = readExifOrientation(dataUrl);
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');

                    // 方向 5-8 需要交换宽高（旋转了 90 度）
                    var swap = orientation >= 5;
                    if (swap) {
                        canvas.width = img.height;
                        canvas.height = img.width;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }

                    // 用标准变换矩阵处理 8 种 EXIF 方向（先 transform 后 drawImage）
                    switch (orientation) {
                        case 2: ctx.transform(-1, 0, 0, 1, canvas.width, 0); break;                 // 水平翻转
                        case 3: ctx.transform(-1, 0, 0, -1, canvas.width, canvas.height); break;    // 旋转180
                        case 4: ctx.transform(1, 0, 0, -1, 0, canvas.height); break;                // 垂直翻转
                        case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;                            // 转置
                        case 6: ctx.transform(0, 1, -1, 0, canvas.height, 0); break;                // 顺时针90
                        case 7: ctx.transform(0, -1, -1, 0, canvas.height, canvas.width); break;    // 横向
                        case 8: ctx.transform(0, -1, 1, 0, 0, canvas.width); break;                 // 逆时针90
                        default: break;
                    }

                    ctx.drawImage(img, 0, 0);
                    // 输出 JPEG，压缩比例适中；保留一定质量
                    done(canvas.toDataURL('image/jpeg', 0.9));
                } catch (err) {
                    console.error('图片方向处理失败，回退原图:', err);
                    done(dataUrl);
                }
            };
            img.onerror = function() {
                showToast('图片无法加载，请重新选择', 'error');
            };
            img.src = dataUrl;
        }

        // 从 dataURL 中提取 EXIF Orientation（简化版，仅取 JPEG APP1 段）
        function readExifOrientation(dataUrl) {
            try {
                var base64 = dataUrl.split(',')[1] || '';
                var binary = atob(base64);
                var view = new DataView(new ArrayBuffer(binary.length));
                for (var i = 0; i < binary.length; i++) view.setUint8(i, binary.charCodeAt(i));

                // JPEG 起始标记
                if (view.getUint16(0, false) !== 0xFFD8) return 1;
                var offset = 2;
                var length = view.byteLength;
                while (offset < length) {
                    var marker = view.getUint16(offset, false);
                    offset += 2;
                    // SOI 之后的标记
                    if (marker === 0xFFE1) {
                        // APP1 段
                        var segLen = view.getUint16(offset, false);
                        offset += 2;
                        var tag = String.fromCharCode(view.getUint8(offset),
                                                       view.getUint8(offset + 1),
                                                       view.getUint8(offset + 2),
                                                       view.getUint8(offset + 3),
                                                       view.getUint8(offset + 4),
                                                       view.getUint8(offset + 5));
                        if (tag === 'Exif\0\0') {
                            // 定位 TIFF 头
                            var tiffStart = offset + 6;
                            var endian = view.getUint16(tiffStart, false);
                            var little = (endian === 0x4949); // II
                            // IFD0 偏移
                            var ifdOffset = view.getUint32(tiffStart + 4, little);
                            var ifdStart = tiffStart + ifdOffset;
                            var entries = view.getUint16(ifdStart, little);
                            for (var e = 0; e < entries; e++) {
                                var entryStart = ifdStart + 2 + e * 12;
                                var tagId = view.getUint16(entryStart, little);
                                if (tagId === 0x0112) { // Orientation
                                    var orient = view.getUint16(entryStart + 8, little);
                                    return orient || 1;
                                }
                            }
                        }
                        offset += segLen - 2;
                    } else if ((marker & 0xFF00) === 0xFF00) {
                        // 其他段，跳过长度
                        var scanLen = view.getUint16(offset, false);
                        offset += scanLen;
                    } else {
                        break;
                    }
                }
            } catch (e) {
                // 解析失败返回默认方向
            }
            return 1;
        }

        // --- 预览页面：关闭 ---
        previewCloseBtn.addEventListener('click', function() {
            previewOverlay.classList.remove('show');
            capturedImageData = null;
        });

        // --- 预览页面：重拍 ---
        retakeBtn.addEventListener('click', function() {
            previewOverlay.classList.remove('show');
            capturedImageData = null;
            // 直接重新唤起相机
            if (getApiKey()) {
                cameraInput.value = '';
                cameraInput.click();
            } else {
                showToast('请先设置 DMXAPI Key（点击右上角 ⚙️）', 'error', 3500);
                settingsModal.classList.add('show');
                apiKeyInput.focus();
            }
        });

        // --- 预览页面：确认识别 ---
        confirmPhotoBtn.addEventListener('click', function() {
            var dataUrl = capturedImageData;
            previewOverlay.classList.remove('show');
            if (!dataUrl || dataUrl === '') {
                showToast('请先拍摄或选择照片', 'error');
                return;
            }
            handlePhotoCapture(dataUrl);
        });

        // --- 设置面板事件 ---
        settingsIcon.addEventListener('click', function() {
            loadApiKey();
            settingsModal.classList.add('show');
        });

        closeSettingsBtn.addEventListener('click', function() {
            settingsModal.classList.remove('show');
        });

        saveApiKeyBtn.addEventListener('click', function() {
            var key = apiKeyInput.value.trim();
            if (!key) {
                showToast('请输入 API Key', 'error');
                return;
            }
            if (!key.startsWith('sk-')) {
                showToast('Key 格式似乎不对，应以 sk- 开头', 'error');
                return;
            }
            saveApiKey(key);
            settingsModal.classList.remove('show');
        });

        clearApiKeyBtn.addEventListener('click', function() {
            if (confirm('确定要清除已保存的 API Key 吗？')) {
                saveApiKey('');
                apiKeyInput.value = '';
                settingsModal.classList.remove('show');
            }
        });

        // 点击模态背景关闭
        settingsModal.addEventListener('click', function(e) {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });

        // --- 预加载语音列表 ---
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        // --- 加载保存的 API Key ---
        loadApiKey();

        // =============================================================
        //  服药提醒：事件绑定与初始化
        // =============================================================
        tabCheck.addEventListener('click', function() { switchTab('check'); });
        tabRemind.addEventListener('click', function() { switchTab('remind'); });

        addTimeBtn.addEventListener('click', function() {
            addTimeInput('');
        });
        saveMedBtn.addEventListener('click', saveMedPlan);

        // 吃药弹窗按钮
        pillOkBtn.addEventListener('click', function() {
            pillAlert.classList.remove('show');
            if (currentRemindAction) {
                // 记录该时段已完成（更新 med_last_notified 已在上方 setItem）
                showToast('✅ 记得按时吃药哦', 'success');
            }
            currentRemindAction = null;
        });
        pillLaterBtn.addEventListener('click', function() {
            pillAlert.classList.remove('show');
            // 10 分钟后再次提醒：记录一个临时 key，并设置一次性定时器
            if (currentRemindAction) {
                var id = currentRemindAction.id;
                var plan = plans.find(function(p) { return p.id === id; });
                if (plan) {
                    var t = nowHM();
                    showToast('⏰ 好的，10 分钟后再提醒你');
                    setTimeout(function() {
                        fireReminder(plan, t);
                    }, 10 * 60 * 1000);
                }
            }
            currentRemindAction = null;
        });

        // 点击弹窗背景不关闭（避免误触），仅用按钮操作

        // 默认给一个时间框，预填下一整点
        addTimeInput(nowPlusOneHour());
        renderPlans();
        updateReminderStatus();

        // 每 15 秒检测一次是否到点（跨过整分钟边界也能及时提醒）
        if (remindTimer) clearInterval(remindTimer);
        remindTimer = setInterval(checkReminders, 15000);
        checkReminders();

        // --- 焦点 ---
        inputEl.focus();

        console.log('💊 药安全 v2 已加载（查药鉴别 + 服药提醒 + 语音朗读）');
    })();
</script>

</body>
</html>
